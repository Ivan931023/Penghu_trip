        // Client-side allowlist (server-side rules are the real protection)
        const ALLOWED_EMAILS = [
            'ivanchen931023@gmail.com'
            // 加伴侶 email 在這裡，例: , 'partner@gmail.com'
        ];

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // Offline persistence — writes queue when offline and sync on reconnect
        db.enablePersistence({ synchronizeTabs: true }).catch(err => {
            console.warn('Firestore persistence:', err.code);
        });

        const googleProvider = new firebase.auth.GoogleAuthProvider();

        window.signIn = async function () {
            const btn = document.getElementById('signin-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 跳轉至 Google...';
            try {
                // Use redirect (more reliable than popup on Safari/iOS/strict-privacy browsers)
                await auth.signInWithRedirect(googleProvider);
            } catch (err) {
                console.error('Sign-in error:', err);
                showLoginError(err.message || '登入失敗');
                btn.disabled = false;
                btn.innerHTML = '<svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> 使用 Google 登入';
            }
        };

        // Handle redirect result on page load (catches OAuth errors from redirect flow)
        auth.getRedirectResult().catch(err => {
            if (err && err.code && err.code !== 'auth/no-auth-event') {
                console.error('Redirect sign-in error:', err);
                showLoginError(err.message || '登入失敗');
            }
        });

        window.signOut = async function () {
            if (!confirm('確定要登出嗎？')) return;
            await auth.signOut();
        };

        function showLoginError(msg) {
            const el = document.getElementById('login-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function hideLoginError() {
            document.getElementById('login-error').classList.add('hidden');
        }

        auth.onAuthStateChanged(async user => {
            if (!user) {
                // Not signed in — show login
                document.getElementById('login-overlay').classList.remove('hidden');
                State.user = null;
                return;
            }
            if (!ALLOWED_EMAILS.includes(user.email)) {
                showLoginError(`${user.email}\n不在受邀名單中。請聯絡管理員加入。`);
                await auth.signOut();
                return;
            }
            // Authenticated & authorized
            State.user = {
                email: user.email,
                displayName: user.displayName || user.email.split('@')[0],
                photoURL: user.photoURL || ''
            };
            hideLoginError();
            document.getElementById('login-overlay').classList.add('hidden');
            attachListeners();
            router.navigate('dashboard');
        });

        // ==========================================
        // FIRESTORE LISTENERS (real-time sync)
        // ==========================================
        function attachListeners() {
            if (State.listenersAttached) return;
            State.listenersAttached = true;

            // Expenses → re-render accounting/dashboard
            db.collection('expenses').orderBy('createdAt', 'asc').onSnapshot(snap => {
                State.expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (State.currentTab === 'accounting' || State.currentTab === 'dashboard') {
                    rerenderCurrent();
                }
            }, err => console.error('Expenses listener:', err));

            // Memories → refresh affected items in schedule
            db.collection('memories').onSnapshot(snap => {
                const newMem = {};
                snap.docs.forEach(d => { newMem[d.id] = d.data(); });
                State.memories = newMem;
                if (State.currentTab === 'schedule') {
                    DATA.schedule.forEach(item => {
                        const el = document.getElementById(`memory-${item.id}`);
                        if (el && !document.getElementById(`memo-editing-${item.id}`)) {
                            el.innerHTML = renderMemoryUI(item.id);
                        }
                    });
                }
            }, err => console.error('Memories listener:', err));

            // Checks (single doc)
            db.collection('app').doc('checks').onSnapshot(doc => {
                State.checks = doc.exists ? (doc.data() || {}) : {};
                if (State.currentTab === 'schedule') {
                    const activeTab = document.querySelector('#schedule-tabs button.bg-ocean-50');
                    if (activeTab) {
                        const d = parseInt(activeTab.id.replace('tab-btn-', ''), 10);
                        renderScheduleList(d);
                    }
                } else if (State.currentTab === 'dashboard') {
                    rerenderCurrent();
                }
            }, err => console.error('Checks listener:', err));
        }

        function rerenderCurrent() {
            const app = document.getElementById('app');
            if (!app) return;
            app.innerHTML = pages[State.currentTab]();
            if (State.currentTab === 'dashboard') fetchWeather();
            if (State.currentTab === 'schedule') initSchedule();
        }

        // 馬公座標 — for weather forecasting
        const PENGHU_COORDS = { lat: 23.5654, lon: 119.5867 };

        // WMO weather code → icon + label
        const WEATHER_MAP = {
            0:  { icon: 'fa-sun',                    label: '晴',        color: 'text-amber-500' },
            1:  { icon: 'fa-sun',                    label: '大致晴朗',  color: 'text-amber-500' },
            2:  { icon: 'fa-cloud-sun',              label: '局部多雲',  color: 'text-amber-400' },
            3:  { icon: 'fa-cloud',                  label: '多雲',      color: 'text-slate-400' },
            45: { icon: 'fa-smog',                   label: '霧',        color: 'text-slate-400' },
            48: { icon: 'fa-smog',                   label: '結霜霧',    color: 'text-slate-400' },
            51: { icon: 'fa-cloud-rain',             label: '輕毛毛雨',  color: 'text-sky-500' },
            53: { icon: 'fa-cloud-rain',             label: '毛毛雨',    color: 'text-sky-500' },
            55: { icon: 'fa-cloud-rain',             label: '濃毛毛雨',  color: 'text-sky-600' },
            61: { icon: 'fa-cloud-showers-heavy',    label: '小雨',      color: 'text-sky-500' },
            63: { icon: 'fa-cloud-showers-heavy',    label: '中雨',      color: 'text-sky-600' },
            65: { icon: 'fa-cloud-showers-heavy',    label: '大雨',      color: 'text-sky-700' },
            71: { icon: 'fa-snowflake',              label: '小雪',      color: 'text-sky-300' },
            73: { icon: 'fa-snowflake',              label: '中雪',      color: 'text-sky-300' },
            75: { icon: 'fa-snowflake',              label: '大雪',      color: 'text-sky-400' },
            77: { icon: 'fa-snowflake',              label: '冰珠',      color: 'text-sky-400' },
            80: { icon: 'fa-cloud-showers-water',    label: '陣雨',      color: 'text-sky-500' },
            81: { icon: 'fa-cloud-showers-water',    label: '強陣雨',    color: 'text-sky-600' },
            82: { icon: 'fa-cloud-showers-water',    label: '豪陣雨',    color: 'text-sky-700' },
            85: { icon: 'fa-snowflake',              label: '陣雪',      color: 'text-sky-300' },
            86: { icon: 'fa-snowflake',              label: '強陣雪',    color: 'text-sky-400' },
            95: { icon: 'fa-cloud-bolt',             label: '雷雨',      color: 'text-violet-500' },
            96: { icon: 'fa-cloud-bolt',             label: '雷雨夾冰雹', color: 'text-violet-600' },

        const weatherInfo = (code) => WEATHER_MAP[code] || { icon: 'fa-question', label: '未知', color: 'text-slate-400' };

        // ==========================================
        // ROUTER
        // ==========================================
        const router = {
            navigate: (page) => {
                State.currentTab = page;

                const app = document.getElementById('app');
                app.innerHTML = pages[page]();
                app.scrollTop = 0;

                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const icon = btn.querySelector('i');
                    if (btn.dataset.target === page) {
                        btn.classList.add('text-ocean-600');
                        btn.classList.remove('text-slate-400');
                        icon.classList.add('fa-bounce');

                        btn.classList.remove('text-ocean-600');

                if (page === 'dashboard') fetchWeather();

        // ==========================================
        // WEATHER (Open-Meteo, no API key)
        // ==========================================
        async function fetchWeather() {
            const today = new Date().toISOString().slice(0, 10);
            const cached = JSON.parse(localStorage.getItem('penghu_weather') || 'null');
            if (cached && cached.fetchedDate === today) {
                State.weather = cached;
                renderWeatherCard();
                return;
            }

            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${PENGHU_COORDS.lat}&longitude=${PENGHU_COORDS.lon}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTaipei&forecast_days=7`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('Weather API ' + res.status);
                const data = await res.json();
                State.weather = { ...data, fetchedDate: today };
                localStorage.setItem('penghu_weather', JSON.stringify(State.weather));
                renderWeatherCard();
            } catch (err) {
                console.error('Weather fetch failed', err);
                renderWeatherCard({ error: true });
            }
        }

        function renderWeatherCard(opts = {}) {
            const slot = document.getElementById('weather-slot');
            if (!slot) return;

            if (opts.error || !State.weather) {
                slot.innerHTML = `<div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm mb-6 flex items-center justify-between text-slate-400 text-sm">
                    <span><i class="fa-solid fa-cloud-question mr-2"></i> 無法載入天氣資訊</span>

                return;
            }

            const w = State.weather;
            const cur = w.current;
            const daily = w.daily;
            const curInfo = weatherInfo(cur.weather_code);

            // Match trip days (6/26-6/29) to forecast index
            const tripDates = ['2026-06-26', '2026-06-27', '2026-06-28', '2026-06-29'];
            const dayLabels = ['Day 1 · 6/26', 'Day 2 · 6/27', 'Day 3 · 6/28', 'Day 4 · 6/29'];
            const forecastRows = tripDates.map((date, i) => {
                const idx = daily.time.indexOf(date);
                if (idx < 0) return null;
                const info = weatherInfo(daily.weather_code[idx]);
                return { label: dayLabels[i], info, max: daily.temperature_2m_max[idx], min: daily.temperature_2m_min[idx], pop: daily.precipitation_probability_max[idx] };
            }).filter(Boolean);

            const tripForecastHtml = forecastRows.length > 0 ? `
                <div class="border-t border-slate-100 mt-4 pt-4">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">旅程 4 天預報</p>

                            <div class="flex items-center justify-between text-sm">
                                <span class="font-medium text-slate-700 w-24">${r.label}</span>
                                <div class="flex items-center gap-2 flex-1">
                                    <i class="fa-solid ${r.info.icon} ${r.info.color}"></i>
                                    <span class="text-slate-500 text-xs">${r.info.label}</span>
                                </div>
                                <span class="text-xs text-sky-600 w-12 text-right">💧${r.pop ?? 0}%</span>
                                <span class="font-mono text-slate-700 w-16 text-right">${Math.round(r.min)}° / ${Math.round(r.max)}°</span>
                            </div>
                        `).join('')}
                    </div>
                </div>` : '';

            // Today's high/low from daily (today's date or first day)
            const todayStr = new Date().toISOString().slice(0, 10);
            const todayIdx = daily.time.indexOf(todayStr);
            const todayHi = todayIdx >= 0 ? Math.round(daily.temperature_2m_max[todayIdx]) : null;
            const todayLo = todayIdx >= 0 ? Math.round(daily.temperature_2m_min[todayIdx]) : null;
            const todayPop = todayIdx >= 0 ? (daily.precipitation_probability_max[todayIdx] ?? 0) : null;

            slot.innerHTML = `
            <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm mb-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">澎湖 · 馬公 今日天氣</p>
                        <div class="flex items-end gap-3">
                            <span class="text-4xl font-bold text-slate-800 font-mono">${Math.round(cur.temperature_2m)}°</span>
                            <div class="pb-1">
                                <p class="text-sm font-semibold ${curInfo.color}">${curInfo.label}</p>
                                <p class="text-xs text-slate-400">風 ${Math.round(cur.wind_speed_10m)} km/h · 濕 ${cur.relative_humidity_2m}%</p>
                            </div>
                        </div>
                        ${todayHi !== null ? `<p class="text-xs text-slate-500 mt-2">今日 ${todayLo}° / ${todayHi}° · 降雨機率 ${todayPop}%</p>` : ''}
                    </div>
                    <i class="fa-solid ${curInfo.icon} ${curInfo.color} text-6xl"></i>
                </div>
                ${tripForecastHtml}
            </div>`;
        }
        window.fetchWeather = fetchWeather;

        // ==========================================
        // PAGE TEMPLATES
        // ==========================================
        const pages = {
            dashboard: () => {
                const now = new Date();
                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();
                const currentTimeVal = currentHour * 60 + currentMinute;

                const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
                const dateStr = now.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'short' });

                const parseTime = (t) => {
                    const [h, m] = t.split(':').map(Number);
                    return h * 60 + m;
                };

                // Trip start: 2026-06-26 (Day 1)
                const tripStartDate = new Date(2026, 5, 26); // June (month 5, 0-indexed)
                const startMidnight = new Date(tripStartDate);
                startMidnight.setHours(0, 0, 0, 0);
                const nowMidnight = new Date(now);
                nowMidnight.setHours(0, 0, 0, 0);
                const diffTime = nowMidnight - startMidnight;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                let day = diffDays + 1;
                if (day < 1 || day > 4) day = -1;

                // Countdown to trip
                const msToTrip = startMidnight - nowMidnight;
                const daysToTrip = Math.ceil(msToTrip / (1000 * 60 * 60 * 24));

                let currentActivity = null;
                let nextActivity = null;
                if (day > 0) {
                    currentActivity = DATA.schedule.find(s => {
                        if (s.day !== day) return false;
                        const start = parseTime(s.time);
                        const end = parseTime(s.endTime);
                        return currentTimeVal >= start && currentTimeVal < end;
                    });
                    nextActivity = DATA.schedule.find(s => {
                        if (s.day !== day) return false;
                        const start = parseTime(s.time);
                        return start > currentTimeVal;
                    });
                }

                let greeting = "早安";
                if (currentHour >= 12 && currentHour < 18) greeting = "午安";
                else if (currentHour >= 18) greeting = "晚安";

                // Countdown card OR current activity card
                let heroCard;
                if (day < 0 && daysToTrip > 0) {
                    heroCard = `<div class="bg-gradient-to-br from-ocean-500 to-ocean-700 rounded-2xl p-6 text-white shadow-lg shadow-ocean-200 mb-6 relative overflow-hidden">

                            <p class="text-ocean-50 text-sm mb-4">2026/06/26 · 立榮 B7-8617 · 13:55 起飛</p>
                            <button onclick="router.navigate('schedule')" class="bg-white/20 hover:bg-white/30 backdrop-blur text-sm font-semibold py-2 px-4 rounded-lg transition">
                                <i class="fa-solid fa-list-check mr-1"></i> 查看完整行程
                            </button>

                    </div>`;
                } else if (currentActivity) {
                    heroCard = `<div class="bg-gradient-to-br from-ocean-500 to-ocean-600 rounded-2xl p-6 text-white shadow-lg shadow-ocean-200 mb-6 relative overflow-hidden">

                            <div class="flex items-center space-x-2 opacity-90 mb-1">
                                <span class="uppercase tracking-wider text-[10px] font-bold bg-white/20 px-2 py-0.5 rounded shadow-sm animate-pulse">正在進行</span>
                                <span class="text-sm font-medium"><i class="fa-regular fa-clock mr-1"></i>${currentActivity.time} - ${currentActivity.endTime}</span>
                            </div>
                            <h2 class="text-3xl font-bold mb-1 leading-tight">${currentActivity.title}</h2>
                            <p class="text-ocean-50 mb-2 flex items-center"><i class="fa-solid fa-location-dot mr-2"></i> ${currentActivity.location}</p>
                            ${currentActivity.notes ? `<p class="text-ocean-50/90 text-sm">${currentActivity.notes}</p>` : ''}
                        </div>
                    </div>`;
                } else if (day > 0) {
                    heroCard = `<div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm mb-6 flex items-center justify-between">
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg">目前沒有行程</h3>
                            <p class="text-slate-500 text-sm">好好享受空檔，或翻翻下一個目標！</p>
                        </div>
                        <div class="h-12 w-12 rounded-full bg-slate-50 flex items-center justify-center text-slate-300">
                            <i class="fa-solid fa-mug-hot text-xl"></i>
                        </div>
                    </div>`;
                } else {
                    heroCard = `<div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm mb-6 text-center">
                        <i class="fa-solid fa-heart text-3xl text-rose-300 mb-2"></i>
                        <h3 class="font-bold text-slate-800 text-lg">旅程已結束</h3>
                        <p class="text-slate-500 text-sm">期待下次再會～</p>
                    </div>`;
                }

                const nextCard = nextActivity
                    ? `<div class="bg-white rounded-xl p-5 border border-slate-100 shadow-sm mb-6 flex items-center justify-between active:scale-[0.99] transition-transform cursor-pointer" onclick="router.navigate('schedule')">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">下一個活動</p>
                            <h3 class="text-lg font-bold text-slate-800">${nextActivity.title}</h3>
                            <p class="text-sm text-ocean-600 font-medium">${nextActivity.time} @ ${nextActivity.location}</p>
                        </div>
                        <div class="h-10 w-10 bg-ocean-50 rounded-full flex items-center justify-center text-ocean-500">
                            <i class="fa-solid fa-chevron-right"></i>
                        </div>
                    </div>`
                    : '';

                // Booking summary card
                const b = DATA.booking;
                const bookingCard = `<div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm mb-6">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">已訂購 · ${b.vendor}</p>

                        </div>
                        <div class="flex items-center text-slate-600">
                            <i class="fa-solid fa-hotel w-5 text-ocean-500"></i>
                            <span class="ml-2">${b.hotel.name} · ${b.hotel.nights} 晚</span>
                        </div>
                    </div>
                    <button onclick="router.navigate('info')" class="w-full mt-4 text-xs font-bold text-ocean-600 hover:text-ocean-700">
                        查看完整訂購資訊 →
                    </button>
                </div>`;

                return `
                <div class="fade-in max-w-md mx-auto min-h-screen pb-20 px-6">

                    <header class="bg-transparent sticky top-0 z-20 py-4 mb-2 flex justify-between items-end">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">${dateStr}</p>
                            <h1 class="text-2xl font-bold text-slate-800">${greeting}，旅人</h1>

                        <div class="text-right">

                            <div class="text-[10px] text-slate-400 font-medium mt-1">${day > 0 ? `Day ${day}` : (day < 0 && daysToTrip > 0 ? '出發前' : '旅程結束')}</div>

                    ${heroCard}

                    <h3 class="font-bold text-slate-800 mb-4 px-1">快速功能</h3>

                        <button onclick="router.navigate('schedule')" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-3 active:scale-95 transition-transform hover:shadow-md">

                const weekStr = dateObj.toLocaleDateString('zh-TW', { weekday: 'short' });
                return `
                <button onclick="renderScheduleList(${d})" id="tab-btn-${d}" class="flex-none snap-start px-4 py-2 rounded-lg border border-slate-100 bg-white shadow-sm text-sm font-medium text-slate-500 hover:bg-ocean-50 hover:text-ocean-600 transition-all whitespace-nowrap">
                    <span class="block text-[10px] uppercase tracking-wider font-bold mb-0.5">Day ${d}</span>
                    <span class="font-bold text-lg">${dateStr}</span> <span class="text-xs opacity-75">(${weekStr})</span>
                </button>`;
            }).join('');

            // Default to current trip day if in range, else day 1
            const now = new Date();
            const tripStart = new Date(2026, 5, 26);
            const startMid = new Date(tripStart); startMid.setHours(0, 0, 0, 0);
            const nowMid = new Date(now); nowMid.setHours(0, 0, 0, 0);
            const diff = Math.ceil((nowMid - startMid) / (1000 * 60 * 60 * 24)) + 1;
            const defaultDay = (diff >= 1 && diff <= 4) ? diff : 1;
            renderScheduleList(defaultDay);
        }

        function renderScheduleList(day) {
            const listContainer = document.getElementById('schedule-list');
            const items = DATA.schedule.filter(s => s.day === day);

            document.querySelectorAll('#schedule-tabs button').forEach(btn => {
                if (btn.id === `tab-btn-${day}`) {
                    btn.classList.add('border-ocean-200', 'bg-ocean-50', 'text-ocean-700', 'ring-1', 'ring-ocean-200');
                    btn.classList.remove('border-slate-100', 'bg-white', 'text-slate-500');
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    btn.classList.remove('border-ocean-200', 'bg-ocean-50', 'text-ocean-700', 'ring-1', 'ring-ocean-200');
                    btn.classList.add('border-slate-100', 'bg-white', 'text-slate-500');
                }
            });

            if (items.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-400">本日無行程</div>`;
                return;
            }

            const doneSet = State.checks || {};

            listContainer.innerHTML = items.map(item => {
                const done = !!doneSet[item.id];
                return `
                <div class="relative flex gap-4">
                    <div class="flex flex-col items-center min-w-[3.5rem] pt-1">
                        <span class="text-sm font-bold text-slate-800">${item.time}</span>
                        <span class="text-xs text-slate-400">${item.endTime}</span>
                    </div>
                    <div class="flex-1 bg-white rounded-xl p-4 shadow-sm border ${done ? 'border-emerald-200 bg-emerald-50/30' : 'border-slate-100'} mb-2 cursor-pointer transition hover:shadow-md" onclick="toggleDetails(${item.id})">
                        <div class="flex justify-between items-start gap-2">
                            <h4 class="font-bold text-slate-800 ${done ? 'line-through opacity-60' : ''}">${item.title}</h4>
                            <span class="text-[10px] uppercase font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded tracking-wide shrink-0">${typeLabel(item.type)}</span>
                        </div>
                        <div class="flex items-center text-xs text-slate-500 mt-1 gap-2">
                            <span><i class="fa-solid fa-location-dot text-ocean-400"></i> ${item.location}</span>
                        </div>
                        <div id="details-${item.id}" class="hidden mt-3 pt-3 border-t border-slate-100 text-sm text-slate-600" onclick="event.stopPropagation()">
                            <p class="leading-relaxed">${item.notes || '無補充說明'}</p>
                            <button onclick="event.stopPropagation(); toggleCheck(${item.id})" class="mt-3 text-xs font-bold ${done ? 'text-slate-400' : 'text-emerald-600'} hover:underline">
                                <i class="fa-solid ${done ? 'fa-rotate-left' : 'fa-circle-check'} mr-1"></i> ${done ? '取消完成' : '標記完成'}
                            </button>
                            <div id="memory-${item.id}" class="mt-4 pt-4 border-t border-dashed border-slate-200">
                                ${renderMemoryUI(item.id)}
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            listContainer.classList.remove('fade-in');
            void listContainer.offsetWidth;
            listContainer.classList.add('fade-in');
        }

        function typeLabel(t) {
            return {
                logistics: '行政',
                transport: '交通',
                activity: '景點',
                food: '美食'
            }[t] || t;
        }

        // ==========================================
        // MEMORY (photos + memo per schedule item)
        // ==========================================
        function getMemory(id) {
            return State.memories[id] || { photos: [], memo: null };
        }

        function memDocRef(id) {
            return db.collection('memories').doc(String(id));
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function renderMemoryUI(id) {
            const mem = getMemory(id);
            const editing = !!document.getElementById(`memo-editing-${id}`);

            const photosHtml = mem.photos && mem.photos.length > 0
                ? `<div class="grid grid-cols-3 gap-2 mb-3">
                    ${mem.photos.map((p, i) => `
                        <div class="relative aspect-square rounded-lg overflow-hidden bg-slate-100 group">
                            <img src="${p.url || p.dataUrl}" alt="" loading="lazy" class="w-full h-full object-cover cursor-pointer" onclick="event.stopPropagation(); viewPhoto(${id}, ${i})">
                            <button onclick="event.stopPropagation(); downloadPhoto(${id}, ${i})" class="absolute bottom-1 left-1 w-7 h-7 bg-white/90 rounded-full flex items-center justify-center text-slate-700 hover:bg-white shadow text-xs">
                                <i class="fa-solid fa-download"></i>
                            </button>
                            <button onclick="event.stopPropagation(); deletePhoto(${id}, '${p.id}')" class="absolute top-1 right-1 w-7 h-7 bg-rose-500/90 rounded-full flex items-center justify-center text-white hover:bg-rose-600 shadow text-xs">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                            ${p.addedBy ? `<div class="absolute bottom-0 right-0 left-0 bg-gradient-to-t from-black/60 to-transparent px-1.5 py-0.5 text-[9px] text-white truncate">${escapeHtml(p.addedBy.displayName || p.addedBy.email || '')}</div>` : ''}
                        </div>
                    `).join('')}
                </div>`
                : '';

            const memoSaved = mem.memo && mem.memo.text;
            const memoHtml = editing
                ? `<div>
                    <textarea id="memo-input-${id}" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ocean-500" placeholder="這個地方有什麼好玩的？...">${memoSaved ? escapeHtml(mem.memo.text) : ''}</textarea>
                    <div class="flex gap-2 mt-2">
                        <button onclick="event.stopPropagation(); saveMemo(${id})" class="flex-1 bg-ocean-600 hover:bg-ocean-700 text-white text-xs font-bold py-2 rounded-lg transition">
                            <i class="fa-solid fa-floppy-disk mr-1"></i> 儲存
                        </button>
                        <button onclick="event.stopPropagation(); cancelMemo(${id})" class="px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold py-2 rounded-lg transition">
                            取消
                        </button>
                    </div>
                </div>`
                : memoSaved
                    ? `<div class="bg-amber-50/60 border border-amber-100 rounded-lg p-3">
                        <p class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">${escapeHtml(mem.memo.text)}</p>
                        <p class="text-[10px] text-slate-400 mt-2 font-mono">${mem.memo.updatedAt}${mem.memo.updatedBy ? ' · ' + escapeHtml(mem.memo.updatedBy.displayName || mem.memo.updatedBy.email || '') : ''}</p>
                        <div class="flex gap-3 mt-2 text-xs">
                            <button onclick="event.stopPropagation(); editMemo(${id})" class="text-ocean-600 font-bold hover:underline">
                                <i class="fa-solid fa-pen mr-1"></i> 編輯
                            </button>
                            <button onclick="event.stopPropagation(); deleteMemo(${id})" class="text-rose-500 font-bold hover:underline">
                                <i class="fa-solid fa-trash-can mr-1"></i> 刪除
                            </button>
                        </div>
                    </div>`
                    : `<button onclick="event.stopPropagation(); editMemo(${id})" class="w-full border-2 border-dashed border-slate-200 rounded-lg p-3 text-xs text-slate-400 hover:text-ocean-600 hover:border-ocean-300 transition">
                        <i class="fa-solid fa-pen-to-square mr-1"></i> 寫下心得
                    </button>`;

            return `
                <div class="space-y-3">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <h5 class="text-xs font-bold text-slate-500 uppercase tracking-widest">
                                <i class="fa-solid fa-camera mr-1 text-ocean-500"></i> 照片 ${mem.photos.length > 0 ? `(${mem.photos.length})` : ''}
                            </h5>
                            <label class="text-xs text-ocean-600 font-bold cursor-pointer hover:underline">
                                <i class="fa-solid fa-plus mr-1"></i> 上傳
                                <input type="file" accept="image/*" multiple class="hidden" onchange="addPhotos(${id}, this.files); this.value=''">
                            </label>
                        </div>
                        ${photosHtml || '<p class="text-xs text-slate-400 italic">尚未上傳照片</p>'}
                    </div>
                    <div>
                        <h5 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">
                            <i class="fa-solid fa-comment-dots mr-1 text-amber-500"></i> 心得
                        </h5>
                        ${memoHtml}
                    </div>
                </div>`;
        }

        function refreshMemoryUI(id) {
            const el = document.getElementById(`memory-${id}`);
            if (el) el.innerHTML = renderMemoryUI(id);
        }

        // Compress image to fit localStorage budget (~800px max, JPEG 0.7)
        function compressImage(file, maxW = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(1, maxW / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        window.addPhotos = async function (id, fileList) {
            const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
            if (files.length === 0) return;
            if (!State.user) { showToast('請先登入', 'error'); return; }

            showToast(`上傳 ${files.length} 張中...`);
            let success = 0;

            for (const f of files) {
                try {
                    const dataUrl = await compressImage(f);
                    const blob = await (await fetch(dataUrl)).blob();
                    const photoId = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);
                    const path = `memories/${id}/${photoId}.jpg`;
                    const ref = storage.ref(path);
                    await ref.put(blob, { contentType: 'image/jpeg' });
                    const url = await ref.getDownloadURL();

                    const photo = {
                        id: photoId,
                        storagePath: path,
                        url,
                        name: f.name,
                        addedAt: new Date().toLocaleString('zh-TW', { hour12: false }),
                        addedBy: { email: State.user.email, displayName: State.user.displayName }
                    };

                    await memDocRef(id).set({
                        photos: firebase.firestore.FieldValue.arrayUnion(photo)
                    }, { merge: true });
                    success++;
                } catch (err) {
                    console.error('Upload failed:', f.name, err);
                }
            }

            showToast(success === files.length ? `已上傳 ${success} 張` : `${success}/${files.length} 張成功`, success > 0 ? 'success' : 'error');
        };

        window.deletePhoto = async function (id, photoId) {
            if (!confirm('確定要刪除這張照片嗎？')) return;
            const mem = State.memories[id];
            if (!mem || !mem.photos) return;
            const photo = mem.photos.find(p => p.id === photoId);
            if (!photo) return;

            try {
                // Remove from Storage first (silently fail if already gone)
                if (photo.storagePath) {
                    await storage.ref(photo.storagePath).delete().catch(() => {});
                }
                await memDocRef(id).update({
                    photos: firebase.firestore.FieldValue.arrayRemove(photo)
                });
                showToast('已刪除');
            } catch (err) {
                console.error('Delete photo failed:', err);
                showToast('刪除失敗: ' + err.message, 'error');
            }
        };

        window.downloadPhoto = async function (id, photoIdx) {
            const mem = getMemory(id);
            const p = mem.photos && mem.photos[photoIdx];
            if (!p) return;
            const item = DATA.schedule.find(s => s.id === id);
            const baseName = (item ? item.title : 'photo').replace(/[/\\?%*:|"<>]/g, '_');
            const fileName = `${baseName}_${photoIdx + 1}.jpg`;
            const src = p.url || p.dataUrl;
            try {
                const res = await fetch(src);
                const blob = await res.blob();
                const objectUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = objectUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
            } catch (err) {
                // Fallback: open in new tab so user can save manually
                window.open(src, '_blank');
            }
        };

        window.viewPhoto = function (id, photoIdx) {
            const mem = getMemory(id);
            const p = mem.photos && mem.photos[photoIdx];
            if (!p) return;
            const item = DATA.schedule.find(s => s.id === id);
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            const src = p.url || p.dataUrl;
            content.innerHTML = `
                <div class="p-4">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-slate-800 text-sm">${item ? item.title : ''}</h3>
                        <button onclick="closeModal()" class="h-8 w-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500"><i class="fa-solid fa-times"></i></button>
                    </div>
                    <img src="${src}" alt="" class="w-full rounded-xl">
                    <div class="flex gap-2 mt-3">
                        <button onclick="downloadPhoto(${id}, ${photoIdx})" class="flex-1 bg-ocean-600 text-white font-bold text-sm py-3 rounded-lg">
                            <i class="fa-solid fa-download mr-1"></i> 下載原始檔
                        </button>
                        <button onclick="closeModal()" class="px-6 bg-slate-100 text-slate-600 font-bold text-sm py-3 rounded-lg">關閉</button>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-2 text-center font-mono">${p.addedAt}${p.addedBy ? ' · ' + escapeHtml(p.addedBy.displayName || p.addedBy.email || '') : ''}</p>
                </div>`;
            modal.classList.remove('hidden');
        };

        window.editMemo = function (id) {
            // mark editing by injecting a hidden marker element
            const el = document.getElementById(`memory-${id}`);
            if (!el) return;
            // Add the marker, then re-render
            const marker = document.createElement('div');
            marker.id = `memo-editing-${id}`;
            marker.style.display = 'none';
            el.appendChild(marker);
            refreshMemoryUI(id);
            // Focus textarea
            setTimeout(() => {
                const ta = document.getElementById(`memo-input-${id}`);
                if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
            }, 0);
        };

        window.cancelMemo = function (id) {
            refreshMemoryUI(id);
        };

        window.saveMemo = async function (id) {
            const ta = document.getElementById(`memo-input-${id}`);
            if (!ta) return;
            if (!State.user) { showToast('請先登入', 'error'); return; }
            const text = ta.value.trim();
            try {
                if (text) {
                    await memDocRef(id).set({
                        memo: {
                            text,
                            updatedAt: new Date().toLocaleString('zh-TW', { hour12: false }),
                            updatedBy: { email: State.user.email, displayName: State.user.displayName }
                        }
                    }, { merge: true });
                    showToast('已儲存心得');
                } else {
                    await memDocRef(id).update({
                        memo: firebase.firestore.FieldValue.delete()
                    });
                    showToast('已清除心得');
                }
            } catch (err) {
                console.error('Save memo failed:', err);
                showToast('同步失敗: ' + err.message, 'error');
            }
        };

        window.deleteMemo = async function (id) {
            if (!confirm('確定要刪除這則心得嗎？')) return;
            try {
                await memDocRef(id).update({
                    memo: firebase.firestore.FieldValue.delete()
                });
                showToast('已刪除');
            } catch (err) {
                console.error('Delete memo failed:', err);
                showToast('同步失敗: ' + err.message, 'error');
            }
        };

        // ==========================================
        // ACTIONS
        // ==========================================
        function toggleDetails(id) {
            const el = document.getElementById(`details-${id}`);
            if (el) el.classList.toggle('hidden');
        }

        window.toggleCheck = async function (id) {
            const newVal = !State.checks[id];
            try {
                if (newVal) {
                    await db.collection('app').doc('checks').set({ [id]: true }, { merge: true });
                } else {
                    await db.collection('app').doc('checks').update({
                        [id]: firebase.firestore.FieldValue.delete()
                    });
                }
            } catch (err) {
                console.error('Toggle check failed:', err);
                showToast('同步失敗: ' + err.message, 'error');
            }
        };

        async function addExpense(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const payload = {
                item: fd.get('item'),
                amount: parseInt(fd.get('amount'), 10) || 0,
                category: fd.get('category'),
                notes: fd.get('notes') || '',
                date: new Date().toLocaleDateString('zh-TW'),
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                createdBy: State.user ? { email: State.user.email, displayName: State.user.displayName } : null
            };
            try {
                await db.collection('expenses').add(payload);
                showToast('已新增支出');
                e.target.reset();
            } catch (err) {
                console.error('Add expense failed:', err);
                showToast('同步失敗: ' + err.message, 'error');
            }
        }

        window.deleteExpense = async function (id) {
            try {
                await db.collection('expenses').doc(id).delete();
                showToast('已刪除');
            } catch (err) {
                console.error('Delete expense failed:', err);
                showToast('同步失敗: ' + err.message, 'error');
            }
        };

        window.closeModal = function () {
            document.getElementById('modal-container').classList.add('hidden');
        };

        window.showToast = function (message, type = 'success') {
            const toast = document.createElement('div');
            const icon = type === 'error' ? 'fa-triangle-exclamation text-rose-400' : 'fa-circle-check text-emerald-400';
            toast.className = `fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl z-[70] flex items-center gap-3 transition-all duration-300 opacity-0 translate-y-[-20px]`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="font-medium text-sm">${message}</span>`;
            document.body.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-y-[-20px]'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // App initializes via auth.onAuthStateChanged above:
        //   not signed in → login overlay shown
        //   signed in & allowed → listeners attached, dashboard rendered
    </script>
</body>

</html>
