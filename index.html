                app.scrollTop = 0;

                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const icon = btn.querySelector('i');
                    if (btn.dataset.target === page) {
                        btn.classList.add('text-ocean-600');
                        btn.classList.remove('text-slate-400');
                        icon.classList.add('fa-bounce');

                    } else {

                    }
                });

                if (page === 'schedule') initSchedule();

        // PAGE TEMPLATES
        // ==========================================
        const pages = {
            dashboard: () => {
                const now = new Date();
                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();
                const currentTimeVal = currentHour * 60 + currentMinute;

                const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
                const dateStr = now.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'short' });

                const parseTime = (t) => {
                    const [h, m] = t.split(':').map(Number);
                    return h * 60 + m;
                };

                // Trip start: 2026-06-26 (Day 1)
                const tripStartDate = new Date(2026, 5, 26); // June (month 5, 0-indexed)
                const startMidnight = new Date(tripStartDate);
                startMidnight.setHours(0, 0, 0, 0);
                const nowMidnight = new Date(now);
                nowMidnight.setHours(0, 0, 0, 0);
                const diffTime = nowMidnight - startMidnight;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                let day = diffDays + 1;
                if (day < 1 || day > 4) day = -1;

                // Countdown to trip
                const msToTrip = startMidnight - nowMidnight;
                const daysToTrip = Math.ceil(msToTrip / (1000 * 60 * 60 * 24));

                let currentActivity = null;
                let nextActivity = null;
                if (day > 0) {
                    currentActivity = DATA.schedule.find(s => {
                        if (s.day !== day) return false;
                        const start = parseTime(s.time);
                        const end = parseTime(s.endTime);
                        return currentTimeVal >= start && currentTimeVal < end;
                    });
                    nextActivity = DATA.schedule.find(s => {
                        if (s.day !== day) return false;
                        const start = parseTime(s.time);
                        return start > currentTimeVal;
                    });
                }

                let greeting = "早安";
                if (currentHour >= 12 && currentHour < 18) greeting = "午安";
                else if (currentHour >= 18) greeting = "晚安";

                // Countdown card OR current activity card
                let heroCard;
                if (day < 0 && daysToTrip > 0) {
                    heroCard = `<div class="bg-gradient-to-br from-ocean-500 to-ocean-700 rounded-2xl p-6 text-white shadow-lg shadow-ocean-200 mb-6 relative overflow-hidden">

                            <h2 class="text-5xl font-bold mb-1 leading-tight">${daysToTrip} <span class="text-2xl font-medium">天</span></h2>
                            <p class="text-ocean-50 text-sm mb-4">2026/06/26 · 立榮 B7-8617 · 13:55 起飛</p>
                            <button onclick="router.navigate('schedule')" class="bg-white/20 hover:bg-white/30 backdrop-blur text-sm font-semibold py-2 px-4 rounded-lg transition">
                                <i class="fa-solid fa-list-check mr-1"></i> 查看完整行程
                            </button>
                        </div>

                            <p class="text-xs font-bold text-slate-500 mb-2"><i class="fa-solid fa-plane-arrival mr-1 text-ocean-500"></i> 回程 · ${b.inbound.flight}</p>
                            <p class="text-sm text-slate-800 font-semibold">${b.inbound.from} → ${b.inbound.to}</p>
                            <p class="text-xs text-slate-500 mt-1">出發 ${b.inbound.depart} · 抵達 ${b.inbound.arrive}</p>
                        </div>

                        <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 flex items-start gap-2">
                            <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
                            <span>${b.notice}</span>
                        </div>

                        <div class="border-t border-slate-100 pt-3">
                            <p class="text-xs font-bold text-slate-500 mb-2"><i class="fa-solid fa-hotel mr-1 text-ocean-500"></i> 住宿 · ${'★'.repeat(b.hotel.rating)}</p>
                            <p class="text-sm text-slate-800 font-semibold">${b.hotel.name}</p>
                            <p class="text-xs text-slate-400 italic">${b.hotel.nameEn}</p>
                            <p class="text-xs text-slate-500 mt-1">${b.hotel.address}</p>
                            <p class="text-xs text-slate-500 mt-2">入住 ${b.hotel.checkIn} · 退房 ${b.hotel.checkOut} (${b.hotel.nights} 晚)</p>
                            <p class="text-xs text-slate-500">${b.hotel.room} · ${b.hotel.guests}</p>
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.hotel.address)}" target="_blank" class="inline-flex items-center gap-1 mt-3 text-xs font-bold text-ocean-600 hover:text-ocean-700">
                                <i class="fa-solid fa-map-pin"></i> 在 Google 地圖打開
                            </a>
                        </div>
                    </div>

                    <!-- 緊急聯絡 -->
                    <h3 class="font-bold text-slate-800 mb-3 px-1 flex items-center gap-2">
                        <i class="fa-solid fa-phone-volume text-rose-500"></i> 緊急聯絡
                    </h3>
                    <div class="space-y-3 mb-8">
                        ${DATA.emergency.map(c => `
                            <a href="tel:${c.phone.replace(/[^+\d]/g, '')}" class="flex items-center p-4 bg-white rounded-xl border border-rose-100 shadow-sm hover:bg-rose-50 transition group">
                                <div class="h-10 w-10 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-phone"></i>
                                </div>
                                <div class="ml-4 flex-1">
                                    <h4 class="font-bold text-slate-800 text-sm">${c.name}</h4>
                                    <p class="text-sm text-slate-500 font-mono">${c.phone}</p>
                                </div>
                                <i class="fa-solid fa-chevron-right text-rose-300"></i>
                            </a>
                        `).join('')}
                    </div>

                    <!-- 旅程資訊 -->
                    <h3 class="font-bold text-slate-800 mb-3 px-1 flex items-center gap-2">
                        <i class="fa-solid fa-circle-info text-slate-400"></i> 旅程資訊
                    </h3>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-5 space-y-2 text-sm">
                        <div class="flex justify-between"><span class="text-slate-500">目的地</span><span class="font-semibold text-slate-800">澎湖 馬公</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">行程</span><span class="font-semibold text-slate-800">4 天 3 夜</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">人數</span><span class="font-semibold text-slate-800">${DATA.config.travelers} 人</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">期間</span><span class="font-semibold text-slate-800">${DATA.config.tripStart} → ${DATA.config.tripEnd}</span></div>
                    </div>

                    <p class="text-center text-xs text-slate-400 mt-8 mb-4">菊島漫遊指揮中心 v1.0</p>
                </div>
                `;
            }
        };

        // ==========================================
        // SCHEDULE HELPERS
        // ==========================================
        function initSchedule() {
            const tabsContainer = document.getElementById('schedule-tabs');
            if (!tabsContainer) return;

            const days = [...new Set(DATA.schedule.map(s => s.day))].sort((a, b) => a - b);

            tabsContainer.innerHTML = days.map(d => {
                // Day 1 = 6/26, so base = 2026-06-25 + d
                const dateObj = new Date(2026, 5, 25 + d);
                const dateStr = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                const weekStr = dateObj.toLocaleDateString('zh-TW', { weekday: 'short' });
                return `
                <button onclick="renderScheduleList(${d})" id="tab-btn-${d}" class="flex-none snap-start px-4 py-2 rounded-lg border border-slate-100 bg-white shadow-sm text-sm font-medium text-slate-500 hover:bg-ocean-50 hover:text-ocean-600 transition-all whitespace-nowrap">
                    <span class="block text-[10px] uppercase tracking-wider font-bold mb-0.5">Day ${d}</span>
                    <span class="font-bold text-lg">${dateStr}</span> <span class="text-xs opacity-75">(${weekStr})</span>
                </button>`;
            }).join('');

            // Default to current trip day if in range, else day 1
            const now = new Date();
            const tripStart = new Date(2026, 5, 26);
            const startMid = new Date(tripStart); startMid.setHours(0, 0, 0, 0);
            const nowMid = new Date(now); nowMid.setHours(0, 0, 0, 0);
            const diff = Math.ceil((nowMid - startMid) / (1000 * 60 * 60 * 24)) + 1;
            const defaultDay = (diff >= 1 && diff <= 4) ? diff : 1;
            renderScheduleList(defaultDay);
        }

        function renderScheduleList(day) {
            const listContainer = document.getElementById('schedule-list');
            const items = DATA.schedule.filter(s => s.day === day);

            document.querySelectorAll('#schedule-tabs button').forEach(btn => {
                if (btn.id === `tab-btn-${day}`) {
                    btn.classList.add('border-ocean-200', 'bg-ocean-50', 'text-ocean-700', 'ring-1', 'ring-ocean-200');
                    btn.classList.remove('border-slate-100', 'bg-white', 'text-slate-500');
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    btn.classList.remove('border-ocean-200', 'bg-ocean-50', 'text-ocean-700', 'ring-1', 'ring-ocean-200');
                    btn.classList.add('border-slate-100', 'bg-white', 'text-slate-500');
                }
            });

            if (items.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-400">本日無行程</div>`;
                return;
            }

            const doneSet = JSON.parse(localStorage.getItem('penghu_checks') || '{}');

            listContainer.innerHTML = items.map(item => {
                const done = !!doneSet[item.id];
                return `
                <div class="relative flex gap-4">
                    <div class="flex flex-col items-center min-w-[3.5rem] pt-1">
                        <span class="text-sm font-bold text-slate-800">${item.time}</span>
                        <span class="text-xs text-slate-400">${item.endTime}</span>
                    </div>
                    <div class="flex-1 bg-white rounded-xl p-4 shadow-sm border ${done ? 'border-emerald-200 bg-emerald-50/30' : 'border-slate-100'} mb-2 cursor-pointer transition hover:shadow-md" onclick="toggleDetails(${item.id})">
                        <div class="flex justify-between items-start gap-2">
                            <h4 class="font-bold text-slate-800 ${done ? 'line-through opacity-60' : ''}">${item.title}</h4>
                            <span class="text-[10px] uppercase font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded tracking-wide shrink-0">${typeLabel(item.type)}</span>
                        </div>
                        <div class="flex items-center text-xs text-slate-500 mt-1 gap-2">
                            <span><i class="fa-solid fa-location-dot text-ocean-400"></i> ${item.location}</span>
                        </div>
                        <div id="details-${item.id}" class="hidden mt-3 pt-3 border-t border-slate-100 text-sm text-slate-600">
                            <p class="leading-relaxed">${item.notes || '無補充說明'}</p>
                            <button onclick="event.stopPropagation(); toggleCheck(${item.id})" class="mt-3 text-xs font-bold ${done ? 'text-slate-400' : 'text-emerald-600'} hover:underline">
                                <i class="fa-solid ${done ? 'fa-rotate-left' : 'fa-circle-check'} mr-1"></i> ${done ? '取消完成' : '標記完成'}
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');

            listContainer.classList.remove('fade-in');
            void listContainer.offsetWidth;
            listContainer.classList.add('fade-in');
        }

        function typeLabel(t) {
            return {
                logistics: '行政',
                transport: '交通',
                activity: '景點',
                food: '美食'
            }[t] || t;
        }

        // ==========================================
        // ACTIONS
        // ==========================================
        function toggleDetails(id) {
            const el = document.getElementById(`details-${id}`);
            if (el) el.classList.toggle('hidden');
        }

        window.toggleCheck = function (id) {
            const doneSet = JSON.parse(localStorage.getItem('penghu_checks') || '{}');
            doneSet[id] = !doneSet[id];
            if (!doneSet[id]) delete doneSet[id];
            localStorage.setItem('penghu_checks', JSON.stringify(doneSet));
            // Re-render current day
            const activeTab = document.querySelector('#schedule-tabs button.bg-ocean-50');
            if (activeTab) {
                const d = parseInt(activeTab.id.replace('tab-btn-', ''));
                renderScheduleList(d);
            }
        };

        function addExpense(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const expense = {
                id: String(Date.now()),
                item: fd.get('item'),
                amount: parseInt(fd.get('amount'), 10) || 0,
                category: fd.get('category'),
                notes: fd.get('notes') || '',
                date: new Date().toLocaleDateString('zh-TW')
            };
            State.expenses.push(expense);
            localStorage.setItem('penghu_expenses', JSON.stringify(State.expenses));
            showToast('已新增支出');
            router.navigate('accounting');
        }

        window.deleteExpense = function (id) {
            State.expenses = State.expenses.filter(e => e.id !== id);
            localStorage.setItem('penghu_expenses', JSON.stringify(State.expenses));
            showToast('已刪除');
            router.navigate('accounting');
        };

        window.closeModal = function () {
            document.getElementById('modal-container').classList.add('hidden');
        };

        window.showToast = function (message, type = 'success') {
            const toast = document.createElement('div');
            const icon = type === 'error' ? 'fa-triangle-exclamation text-rose-400' : 'fa-circle-check text-emerald-400';
            toast.className = `fixed top-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl z-[70] flex items-center gap-3 transition-all duration-300 opacity-0 translate-y-[-20px]`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="font-medium text-sm">${message}</span>`;
            document.body.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-y-[-20px]'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // Init
        router.navigate('dashboard');
    </script>
</body>

</html>
